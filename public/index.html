<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>किसान AI कैलेंडर</title>
  <meta name="description" content="उद्यानिकी किसानों के लिए AI कैलेंडर: फल, फूल, सब्जी, मसाले, वानिकी और सरकारी योजनाएं">
  <meta name="theme-color" content="#0b4757">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="किसान कैलेंडर">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/icons/icon.svg" alt="" width="34" height="34">
      <div>
        <div class="brand-title" data-i18n="appName"></div>
        <div class="brand-sub" data-i18n="university"></div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn install" id="install-btn" hidden data-i18n="install"></button>
      <button class="btn light desktop-only" id="crop-plan-btn" data-i18n="cropPlan"></button>
      <button class="btn light" id="lang-toggle" aria-label="Language">English</button>
    </div>
  </header>

  <div class="offline-banner" id="offline-banner" hidden data-i18n="offline"></div>

  <div class="app">
    <main class="calendar view view-calendar">
      <section class="banner">
        <div class="year-badge" id="year-badge"></div>
        <div class="featured" id="featured" title="">
          <span class="featured-emoji" id="featured-emoji"></span>
          <span class="featured-label" id="featured-label"></span>
        </div>
        <div class="month-head">
          <div class="month-nav">
            <button class="icon-btn" id="prev" aria-label="Previous month">&#8249;</button>
            <button class="btn light small" id="today" data-i18n="today"></button>
            <button class="icon-btn" id="next" aria-label="Next month">&#8250;</button>
          </div>
          <h1 id="month-label"></h1>
          <div class="hindu-months" id="hindu-months"></div>
        </div>
      </section>

      <div class="weekdays" id="weekdays"></div>
      <div class="grid" id="grid"></div>

      <div class="holiday-notes" id="holiday-notes"></div>

      <section class="categories">
        <a class="podcast" id="podcast" target="_blank" rel="noopener">
          <span aria-hidden="true">🎧</span> <span id="podcast-label"></span>
        </a>
        <div class="category-row" id="category-row"></div>
      </section>

      <footer class="uni-footer">
        <span data-i18n="university"></span>
        <a href="https://www.mguvv.ac.in" target="_blank" rel="noopener">www.mguvv.ac.in</a>
      </footer>
    </main>

    <aside class="sidebar">
      <section class="panel day-panel view view-calendar">
        <div class="panel-head">
          <h2 id="day-label"></h2>
          <button class="btn small" id="new-event" data-i18n="newEvent"></button>
        </div>
        <ul class="agenda" id="agenda"></ul>
      </section>

      <section class="panel advisory-panel view view-work view-schemes">
        <div class="panel-head">
          <h2 id="advisory-title"></h2>
          <a class="more-link" id="advisory-more" target="_blank" rel="noopener" data-i18n="learnMore"></a>
        </div>
        <div class="advisory-tabs" id="advisory-tabs" role="tablist"></div>
        <ul class="advisory-list" id="advisory-list"></ul>
      </section>

      <section class="panel assistant-panel view view-ai">
        <div class="panel-head">
          <h2 data-i18n="assistant"></h2>
          <button class="icon-btn small" id="speak-toggle" aria-pressed="false" title=""></button>
        </div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <div class="suggestions" id="suggestions"></div>
        <form class="chat-form" id="chat-form">
          <button class="icon-btn mic" type="button" id="mic" hidden>🎤</button>
          <input id="chat-input" type="text" autocomplete="off" required>
          <button class="btn primary" type="submit" data-i18n="send"></button>
        </form>
      </section>
    </aside>
  </div>

  <button class="fab mobile-only view view-calendar" id="fab-plan" type="button">🌱 <span data-i18n="cropPlanShort"></span></button>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Main">
    <a href="#calendar" data-view="calendar"><span class="nav-icon">📅</span><span data-i18n="navCalendar"></span></a>
    <a href="#work" data-view="work"><span class="nav-icon">🌱</span><span data-i18n="navWork"></span></a>
    <a href="#ai" data-view="ai"><span class="nav-icon">🤖</span><span data-i18n="navAi"></span></a>
    <a href="#schemes" data-view="schemes"><span class="nav-icon">📜</span><span data-i18n="navSchemes"></span></a>
  </nav>

  <dialog id="ios-install-dialog">
    <form method="dialog">
      <h2 data-i18n="installTitle"></h2>
      <ol class="ios-steps">
        <li data-i18n="iosStep1"></li>
        <li data-i18n="iosStep2"></li>
        <li data-i18n="iosStep3"></li>
      </ol>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button class="btn primary" value="ok" data-i18n="ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="event-dialog">
    <form method="dialog" id="event-form">
      <h2 id="dialog-title"></h2>
      <label><span data-i18n="title"></span> <input name="title" required></label>
      <label class="inline"><input type="checkbox" name="allDay"> <span data-i18n="allDay"></span></label>
      <div class="row">
        <label><span data-i18n="start"></span> <input name="start" type="datetime-local" required></label>
        <label><span data-i18n="end"></span> <input name="end" type="datetime-local" required></label>
      </div>
      <label><span data-i18n="category"></span> <select name="category" id="category-select"></select></label>
      <label><span data-i18n="location"></span> <input name="location"></label>
      <label><span data-i18n="notes"></span> <textarea name="notes" rows="3"></textarea></label>
      <p class="form-error" id="form-error" hidden></p>
      <div class="dialog-actions">
        <button class="btn danger" type="button" id="delete-event" data-i18n="delete" hidden></button>
        <span class="spacer"></span>
        <button class="btn" type="button" id="cancel-event" data-i18n="cancel"></button>
        <button class="btn primary" type="submit" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="plan-dialog">
    <form method="dialog" id="plan-form">
      <h2 data-i18n="cropPlanTitle"></h2>
      <p class="hint" data-i18n="cropPlanHint"></p>
      <label><span data-i18n="category"></span> <select name="category" id="plan-category"></select></label>
      <label><span data-i18n="crop"></span> <input name="crop" list="crop-options" required></label>
      <datalist id="crop-options"></datalist>
      <div class="row">
        <label><span data-i18n="sowDate"></span> <input name="date" type="date" required></label>
        <label><span data-i18n="area"></span> <input name="area" type="number" min="0.05" step="0.05" value="1"></label>
      </div>
      <label><span data-i18n="district"></span> <input name="district" value="दुर्ग"></label>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button class="btn" type="button" id="cancel-plan" data-i18n="cancel"></button>
        <button class="btn primary" type="submit" data-i18n="makePlan"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
